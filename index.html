<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E3B33">
<title>Révision INFAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style id="app-css">:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#16231F; --soft:#5E6E68; --line:#E1DDD2;
  --h1:#0E3B33; --h2:#17594C; --coral:#E8772E; --turq:#2BB39A; --gold:#FFB547;
  --mint:#DDF3EC; --peach:#FFE6D6; --tint:#E6EEEB; --tint2:#F1F5F3; --tint3:#FFF1E7;
  --red:#E5484D; --amber:#F5A524; --green:#1FAE6B; --grey:#DAD6CC;
  --r:22px; --sh:0 6px 22px rgba(14,59,51,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font,'Outfit'),'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:calc(16px*var(--gts,1)*var(--ts,1));line-height:var(--lh,1.45);font-weight:var(--fw,400);font-style:var(--fst,normal);letter-spacing:var(--ls,0);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.brand,.secT,.nm,.mt,.tl .l,.bigq,.qq,.mhead .t{font-family:var(--fontH,var(--font,'Outfit')),'Outfit',system-ui,sans-serif}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:max(16px,calc(16px*var(--gts,1)*var(--ts,1)));color:inherit}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:120px}
.app.nonav{padding-bottom:30px}
.layout{display:block}
.side{display:none}
@media (min-width:1000px){
 .layout.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,440px);gap:22px;max-width:1240px;margin:0 auto;padding:0 18px;align-items:start}
 .layout.split .side{display:block;position:sticky;top:0;max-height:100vh;overflow:auto;padding-bottom:110px;scrollbar-width:thin}
 .layout.split .app{max-width:none;margin:0}
 .layout.split .side .hdr{border-radius:0 0 30px 30px}
}
/* en-tête */
.hdr{background:linear-gradient(160deg,var(--hdrA,var(--h1)),var(--hdrB,var(--h2)) 120%);color:var(--hdrInk,#fff);box-shadow:var(--hdrSh,none);padding:16px 20px 22px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hdr:after{content:'';position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--blob,rgba(43,179,154,.35)),transparent 70%);pointer-events:none}
.hdr>*{position:relative;z-index:1}
.sig{font-weight:800;font-size:calc(20px*var(--gts,1)*var(--ts,1));letter-spacing:.1px}
.sig b{color:var(--sigB,var(--coral))}
.hdr .sig.top{margin-bottom:10px}
.wel{font-weight:700;opacity:.9;font-size:calc(17px*var(--gts,1)*var(--ts,1))}
.brand{font-weight:900;font-size:calc(42px*var(--gts,1)*var(--ts,1));letter-spacing:-1px;line-height:.98;margin:2px 0 0}
.brand .b1{background:linear-gradient(90deg,var(--brand1a,#BFF3E3),var(--brand1b,#5FD4B6));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .b2{background:linear-gradient(90deg,var(--b2a,#FFD08A),var(--b2b,#FF9A4A));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.9;font-size:calc(15px*var(--gts,1)*var(--ts,1));margin-top:6px}
.where{margin-top:10px;display:inline-block;font-weight:800;font-size:calc(14px*var(--gts,1)*var(--ts,1));background:rgba(255,255,255,.14);padding:5px 12px;border-radius:999px}
.hdr.mini{padding:12px 14px 16px;display:flex;align-items:center;gap:12px}
.hdr.mini .back{background:var(--coral);color:#fff;font-weight:800;padding:12px 15px;border-radius:16px;white-space:nowrap;font-size:calc(16px*var(--gts,1)*var(--ts,1));flex:0 0 auto}
.hdr.mini .tt{min-width:0;flex:1}
.hdr.mini .tt small{display:block;opacity:.8;font-size:calc(13.5px*var(--gts,1)*var(--ts,1))}
.hdr.mini .tt .mt{font-weight:800;font-size:calc(19px*var(--gts,1)*var(--ts,1));line-height:1.15}
.hdr.mini .sig{font-size:calc(14px*var(--gts,1));margin-top:3px;opacity:.95}
.wrap{padding:16px}
.card{border:var(--cardBd,none);background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:calc(19px*var(--gts,1)*var(--ts,1))}
.muted{color:var(--soft)}
.small{font-size:calc(13.5px*var(--gts,1)*var(--ts,1))}
.secT{font-weight:900;font-size:calc(21px*var(--gts,1)*var(--ts,1));margin:6px 0 12px;display:flex;align-items:center;gap:8px}
.secT .ln{flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--coral),transparent)}
/* boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:18px;font-weight:800;font-size:calc(17px*var(--gts,1)*var(--ts,1));background:var(--h1);color:#fff;margin-bottom:10px;box-shadow:var(--sh)}
.btn.coral{background:var(--coral)}
.btn.light{background:var(--tint);color:var(--h1);box-shadow:none}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tin{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;outline:0;background:#fff;transition:border-color .15s,box-shadow .15s}
.tin:focus{border-color:var(--turq);box-shadow:0 0 0 4px color-mix(in srgb,var(--turq) 22%,transparent)}
/* accueil */
.hello{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--tint3),#fff);border:2px solid color-mix(in srgb,var(--coral) 30%,transparent)}
.ava{width:70px;height:70px;border-radius:50%;background:var(--h1);display:flex;align-items:center;justify-content:center;font-size:calc(40px*var(--gts,1)*var(--ts,1));flex:0 0 auto;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--coral)}
.hello .nm{font-weight:800;font-size:calc(19px*var(--gts,1)*var(--ts,1));line-height:1.2}
.hello .lv{font-weight:700;font-size:calc(13.5px*var(--gts,1)*var(--ts,1));color:var(--soft);margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:calc(12px*var(--gts,1)*var(--ts,1));font-weight:800;padding:3px 9px;border-radius:9px;background:var(--mint);color:var(--h2)}
.pill.o{background:var(--peach);color:#A4471A}
.bar{height:9px;border-radius:9px;background:var(--tint);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--coral));border-radius:9px}
.resume{display:flex;align-items:center;gap:12px;background:var(--h1);color:#fff;cursor:pointer}
.resume .ic{width:46px;height:46px;border-radius:14px;background:var(--coral);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
.resume b{display:block}
.step{display:flex;gap:14px;align-items:center;cursor:pointer}
.step .n{width:54px;height:54px;border-radius:16px;background:var(--coral);color:#fff;font-weight:900;font-size:calc(26px*var(--gts,1)*var(--ts,1));display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.step .tx{flex:1;min-width:0}
.step .tx b{display:block;font-size:calc(17px*var(--gts,1)*var(--ts,1))}
/* grille matières */
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px}
.tile{border:var(--cardBd,none);background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 10px 10px;min-height:118px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden}
.tile:before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--tc,var(--coral))}
.tile:after{content:'';position:absolute;right:-22px;bottom:-22px;width:70px;height:70px;border-radius:50%;background:var(--tc,var(--coral));opacity:.12}
.tile>*{position:relative;z-index:1}
.tile .e{font-size:calc(32px*var(--gts,1)*var(--ts,1));line-height:1;margin-top:4px}
.tile .l{font-weight:800;font-size:calc(15px*var(--gts,1)*var(--ts,1));line-height:1.12;margin-top:8px;word-break:break-word}
.tile .n{font-size:calc(11.5px*var(--gts,1)*var(--ts,1));color:var(--soft);margin-top:3px;font-weight:600}
.tile .st{position:absolute;right:8px;top:12px;font-size:14px}
.tile.add{background:transparent;border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;text-align:center;color:var(--soft)}
.tile.add:before,.tile.add:after{display:none}
/* listes */
.li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--tint2);margin-bottom:8px;cursor:pointer}
.li .em{font-size:calc(24px*var(--gts,1)*var(--ts,1));width:42px;height:42px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;line-height:1.2}
.li .tx small{color:var(--soft)}
.li .go{font-weight:900;color:var(--coral)}
.empty{color:var(--soft);font-size:calc(14.5px*var(--gts,1)*var(--ts,1));padding:6px 2px}
.ring{width:54px;height:54px;flex:0 0 auto}
/* fiche matière */
.mhead{display:flex;gap:14px;align-items:center}
.mhead .big{width:74px;height:74px;border-radius:22px;background:var(--tc);display:flex;align-items:center;justify-content:center;font-size:calc(42px*var(--gts,1)*var(--ts,1));flex:0 0 auto;color:#fff}
.mhead .t{font-weight:900;font-size:calc(21px*var(--gts,1)*var(--ts,1));line-height:1.15}
.lvb{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:var(--h1);color:#fff;font-weight:800;border-radius:999px;padding:5px 12px;font-size:calc(14px*var(--gts,1)*var(--ts,1))}
.star{font-size:26px;line-height:1;padding:6px;flex:0 0 auto}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);cursor:pointer}
.act .dot{width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:calc(24px*var(--gts,1)*var(--ts,1));background:var(--coral);box-shadow:0 0 0 4px #fff,0 0 0 6px color-mix(in srgb,var(--coral) 45%,transparent)}
.act .dot span{filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.act b{display:block;font-size:calc(18px*var(--gts,1)*var(--ts,1));line-height:1.15}
.act small{color:var(--soft);font-size:calc(13.5px*var(--gts,1)*var(--ts,1))}
.act.exam{border-color:var(--coral);background:var(--tint3)}
.act.exam b{color:#B3471A}
.act .arr{margin-left:auto;font-weight:900;color:var(--coral);font-size:22px}
/* sujets */
.seg{display:flex;gap:6px;background:var(--tint);padding:5px;border-radius:18px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:14px;font-weight:800;font-size:calc(14.5px*var(--gts,1)*var(--ts,1))}
.seg button.on{background:#fff;box-shadow:var(--sh);color:var(--h1)}
.suj{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:13px;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer;border:var(--cardBd,none)}
.suj .no{width:48px;height:48px;border-radius:14px;background:var(--h1);color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:0 0 auto}
.suj .no small{font-size:10px;font-weight:700;opacity:.8}
.suj .tx{flex:1;min-width:0}
.suj .tx b{display:block}
.suj .tx small{color:var(--soft)}
.suj.done .no{background:var(--green)}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:calc(14px*var(--gts,1)*var(--ts,1));color:var(--soft);margin-bottom:8px}
.pbar{height:9px;background:var(--tint);border-radius:9px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--coral));transition:width .3s}
.qtype{display:inline-block;font-size:calc(12px*var(--gts,1)*var(--ts,1));font-weight:800;padding:4px 10px;border-radius:10px;background:var(--mint);color:var(--h2);margin:0 6px 8px 0;text-transform:uppercase;letter-spacing:.4px}
.qtype.cas{background:#EDE4FF;color:#5B3BC4}.qtype.vf{background:#FFF1CC;color:#9A6400}.qtype.open{background:#E2EEFF;color:#2457A8}
.qch{font-size:calc(12.5px*var(--gts,1)*var(--ts,1));color:var(--soft);font-weight:700}
.scen{background:#F5F0FF;border-left:5px solid #7C5CFF;padding:12px 14px;border-radius:12px;margin:4px 0 10px;font-size:calc(15.5px*var(--gts,1)*var(--ts,1))}
.qq{font-weight:700;font-size:calc(19px*var(--gts,1)*var(--ts,1));line-height:1.35;margin:4px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px;border:2px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--card);font-size:calc(16px*var(--gts,1)*var(--ts,1));font-weight:500}
.opt .k{flex:0 0 30px;height:30px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(14px*var(--gts,1)*var(--ts,1))}
.opt.sel{border-color:var(--h2);background:var(--tint2)}.opt.sel .k{background:var(--h2);color:#fff}
.opt.ok{border-color:var(--green);background:#E6F7EE}.opt.ok .k{background:var(--green);color:#fff}
.opt.ko{border-color:var(--red);background:#FDECEC}.opt.ko .k{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.vfrow{display:flex;gap:10px}.vfrow .opt{justify-content:center;font-weight:800;font-size:calc(18px*var(--gts,1)*var(--ts,1))}
.fb{border-radius:18px;padding:14px 16px;margin:12px 0;font-size:calc(15.5px*var(--gts,1)*var(--ts,1))}
.fb.good{background:#E6F7EE;border:2px solid #A6E3C3}.fb.bad{background:#FDECEC;border:2px solid #F5B5B5}.fb.neu{background:var(--tint2);border:2px solid var(--line)}
.fb .h{font-weight:900;font-size:calc(18px*var(--gts,1)*var(--ts,1));margin-bottom:4px}
.fb .ex{margin-top:8px;color:#34443F}
.qbtns{display:flex;gap:10px}
.qbtns .btn{flex:1}
.pin{flex:0 0 auto!important;width:auto!important;padding:15px 16px!important}
.pin.on{background:var(--amber);color:#1a1a1a}
.timer{font-weight:900;color:var(--gold)}
.qnums{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.qnums button{width:34px;height:34px;border-radius:10px;background:var(--tint);font-weight:800;font-size:13px}
.qnums button.a{background:var(--h2);color:#fff}.qnums button.c{outline:3px solid var(--coral)}
/* résultat */
.center{text-align:center}
.score{font-size:calc(64px*var(--gts,1)*var(--ts,1));font-weight:900;color:var(--h2);line-height:1}
.rv{border-left:5px solid var(--red);padding:10px 12px;background:var(--card);border-radius:12px;margin:8px 0;font-size:calc(14.5px*var(--gts,1)*var(--ts,1));box-shadow:var(--sh)}
.rv.okk{border-color:var(--green)}
.rv .ans{margin-top:4px;color:#1D6B45;font-weight:700}
/* appli complète */
.appwrap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg)}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--hdrA,var(--h1));color:var(--hdrInk,#fff);flex:0 0 auto;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.appbar .back{background:var(--coral);color:#fff;font-weight:800;padding:10px 13px;border-radius:14px;white-space:nowrap}
.appbar .tt{flex:1;min-width:0;line-height:1.15}
.appbar .tt>b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .tt .sig{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .tt .sig{font-size:12.5px}
.appframe{flex:1;width:100%;border:0;background:#fff}
.loading{display:flex;align-items:center;justify-content:center;flex:1;font-weight:800;color:var(--soft)}
/* heures */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:calc(14.5px*var(--gts,1)*var(--ts,1))}
th{background:var(--h1);color:#fff;text-align:left;padding:9px 10px;font-weight:700}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;background:#fff}
tr:nth-child(even) td{background:var(--tint2)}
.hform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hform .tin{padding:11px 12px}
.x{color:var(--red);font-weight:900;padding:2px 6px}
/* programme */
.ptab{display:grid;gap:10px}
.pst{border-radius:20px;padding:14px;background:var(--card);box-shadow:var(--sh);border-left:8px solid var(--pc);border:var(--cardBd,none);border-left:8px solid var(--pc)}
.pst.cur{outline:3px solid var(--coral);outline-offset:2px}
.pst .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pst .h b{font-size:calc(18px*var(--gts,1)*var(--ts,1))}
.pst .per{margin-left:auto;background:#FFF4C9;color:#7A5A00;font-weight:800;border-radius:10px;padding:3px 9px;font-size:calc(13px*var(--gts,1)*var(--ts,1))}
.pst .ob{font-weight:700;color:var(--h2);margin:6px 0}
.pst ul{margin:4px 0 0;padding-left:20px}
.pst li{margin:3px 0}
.gen{display:grid;grid-template-columns:1fr;gap:10px}
.box{border-radius:18px;padding:14px;background:var(--bx,#fff)}
.box h4{margin:0 0 6px;font-size:calc(17px*var(--gts,1)*var(--ts,1));color:#9E2A22}
.box ul{margin:0;padding-left:20px}
@media (min-width:640px){.gen{grid-template-columns:1fr 1fr 1fr}}
/* onboarding */
.onb{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px 40px;display:flex;flex-direction:column}
.onb .hero{background:linear-gradient(160deg,var(--hdrA,var(--h1)),var(--hdrB,var(--h2)) 120%);color:var(--hdrInk,#fff);border-radius:28px;padding:22px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.onb .hero:after{content:'';position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--blob,rgba(43,179,154,.35)),transparent 70%)}
.onb .hero>*{position:relative;z-index:1}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--grey)}.dots i.on{width:26px;background:var(--coral)}
.bigq{font-weight:900;font-size:calc(26px*var(--gts,1)*var(--ts,1));line-height:1.15;margin:4px 0 6px}
.qlab{display:inline-block;font-weight:900;color:var(--red);font-size:calc(18px*var(--gts,1)*var(--ts,1))}
.choices{display:grid;gap:12px;margin-top:14px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh);cursor:pointer}
.choice .ce{font-size:calc(34px*var(--gts,1)*var(--ts,1));flex:0 0 auto}
.choice b{display:block;font-size:calc(24px*var(--gts,1)*var(--ts,1));color:var(--h1);line-height:1}
.choice small{color:var(--soft);font-size:calc(14px*var(--gts,1)*var(--ts,1))}
.choice.on{border-color:var(--coral);background:var(--tint3)}
.choices.n3{grid-template-columns:repeat(3,1fr)}
.choices.n3 .choice{flex-direction:column;justify-content:center;text-align:center;padding:20px 8px}
.choices.n3 .choice b{font-size:calc(30px*var(--gts,1)*var(--ts,1))}

function iconize(root){const st=icoStyle();if(st==='emoji'||!root)return;const w=document.createTreeWalker(root,4,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest(NOICO))return 2;EMORX.lastIndex=0;return EMORX.test(n.nodeValue)?1:2}});const L=[];let n;while(n=w.nextNode())L.push(n);
 L.forEach(t=>{EMORX.lastIndex=0;const v=t.nodeValue;let h='',last=0,ch=false,m;while(m=EMORX.exec(v)){const k=EMOMAP[m[1]];if(!k)continue;h+=esc(v.slice(last,m.index))+`<svg class="ico ico-${st}" viewBox="0 0 24 24" aria-label="${esc(m[0])}"><use href="#i-${k}"/></svg>`;last=m.index+m[0].length;ch=true}
  if(!ch)return;h+=esc(v.slice(last));const sp=document.createElement('span');sp.className='icw';sp.innerHTML=h;t.replaceWith(sp)})}
function iconSprite(){if($('#icoSprite'))$('#icoSprite').remove();const d=document.createElement('div');d.id='icoSprite';d.style.display='none';d.innerHTML='<svg xmlns="http://www.w3.org/2000/svg">'+Object.keys(ICONS).map(k=>`<symbol id="i-${k}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</symbol>`).join('')+'</svg>';document.body.appendChild(d)}

function mLevel(pct){const L=[[0,'🌱',Tx('mlv.1','Débutant')],[20,'📘',Tx('mlv.2','Apprenti')],[40,'🎯',Tx('mlv.3','Confirmé')],[60,'🚀',Tx('mlv.4','Avancé')],[80,'🏆',Tx('mlv.5','Expert')]];let r=L[0],i=0;L.forEach((l,k)=>{if(pct>=l[0]){r=l;i=k}});return{e:r[1],n:r[2],i:i+1}}
function ring(pct,col){const r=21,C=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="${r}" fill="none" style="stroke:var(--tint)" stroke-width="7"/><circle cx="27" cy="27" r="${r}" fill="none" stroke="${col||'var(--coral)'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 27 27)"/><text x="27" y="31" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--ink)">${pct}%</text></svg>`}
function diffIds(mid){return Object.keys(S.diff).filter(id=>QI[id]&&(!mid||QI[id].m===mid))}
function sujSize(){return Math.max(10,+(E.content&&E.content.sujet)||META.sujet||50)}
function sujets(mid){const qs=(QBM[mid]||[]).slice().sort((a,b)=>a.c-b.c);const n=Math.max(1,Math.ceil(qs.length/sujSize()));const out=Array.from({length:n},()=>[]);qs.forEach((q,i)=>out[i%n].push(q.id));return out}

/* grille de tuiles réordonnables */
function grid(gid,tiles){const ord=E.tiles&&E.tiles[gid];let list=tiles.slice();
 if(Array.isArray(ord)){const m={};tiles.forEach(t=>m[t.id]=t);list=ord.filter(o=>m[o.id]).map(o=>Object.assign({},m[o.id],{hidden:!!o.hidden}));tiles.forEach(t=>{if(!ord.some(o=>o.id===t.id))list.push(t)})}
 return `<div class="grid" data-grid="${gid}">${list.filter(t=>!t.hidden||EDITMODE).map(t=>`<button class="tile sf${t.hidden?' tile-hid':''}${t.cls?' '+t.cls:''}" data-tile="${esc(t.id)}" style="--tc:${t.c||'var(--coral)'}" onclick="${t.on}">${t.st?`<span class="st">${t.st}</span>`:''}<span class="e">${t.e}</span><span><span class="l" style="display:block">${t.l}</span><span class="n" style="display:block">${t.n}</span></span></button>`).join('')}</div>`}

function custHTML(c,k){const t=c.title?`<h3>${esc(c.title)}</h3>`:'';
 if(c.type==='note')return `<div class="card sf cnote" style="--nc:${esc(c.col||'#E8772E')}">${c.emo?`<span class="ce">${esc(c.emo)}</span>`:''}<div>${t}<div class="custx" data-cx="${esc(k)}">${c.html||''}</div></div></div>`;
 if(c.type==='button')return `<button class="btn ${c.style||'coral'}" onclick="custGo('${jsq(k)}')">${esc((c.emo?c.emo+' ':'')+(c.title||'…'))}</button>`;
 if(c.type==='image')return `<figure class="card sf cimg">${t}${c.img?`<img loading="lazy" decoding="async" src="${c.img}" alt="">`:''}${c.html?`<figcaption class="custx" data-cx="${esc(k)}">${c.html}</figcaption>`:''}</figure>`;
 return `<div class="card sf">${t}<div class="custx" data-cx="${esc(k)}">${c.html||''}</div></div>`}

function progId(){return PROGS()[S.prog]?S.prog:'6m'}
function weekNow(){if(!S.start)return 1;return Math.max(1,Math.floor((Date.now()-new Date(S.start).getTime())/(864e5*7))+1)}
function phaseNow(){const P=PROGS()[progId()],w=weekNow();let i=P.ph.findIndex(p=>w>=p.f&&w<=p.t);if(i<0)i=P.ph.length-1;return{P,i,ph:P.ph[i],w,over:w>P.w}}
function planStats(){const mats=myMats();let tot=0;mats.forEach(m=>tot+=(QBM[m.id]||[]).length?sujets(m.id).length:0);const done=S.done||[];const uniq=new Set(done.filter(x=>MATI[x.mid]).map(x=>x.mid+'#'+x.k)).size;
 const {P,i,w}=phaseNow();const wk0=new Date(new Date(S.start||today()).getTime()+(w-1)*7*864e5).getTime();const thisWeek=done.filter(x=>x.t>=wk0).length;
 let target;if(i<=1){const left=Math.max(0,tot-uniq),weeks=Math.max(1,P.ph[1].t-w+1);target=Math.max(1,Math.ceil((left+thisWeek)/weeks))}else if(i===2){target=Math.max(1,Math.ceil(tot*.5/Math.max(1,P.ph[2].t-P.ph[2].f+1)))}else target=Math.max(1,Math.ceil(tot*.25/Math.max(1,P.ph[3].t-P.ph[3].f+1)));
 return{tot,uniq,thisWeek,target}}
B('home.step','Mon programme (résumé)',()=>{const {P,i,ph,w}=phaseNow(),st=planStats();return `<div class="card sf step" onclick="tab('programme')"><div class="n" style="background:${ph.c}">${i+1}</div><div class="tx"><small class="muted">${T('home.step.lbl','{prog} · semaine {w}/{tw}',{prog:esc(P.n),w:Math.min(w,P.w),tw:P.w})}</small><b>${esc(ph.n)} — ${esc(ph.o)}</b><small class="muted">${T('home.step.week','Aujourd’hui : {s} séance(s) · cette semaine : {d}/{t} sujet(s) →',{s:plan().filter(x=>x.d===todayIdx()).length,d:st.thisWeek,t:st.target})}</small><div class="bar"><i style="width:${Math.min(100,st.thisWeek/st.target*100)}%"></i></div></div></div>`});

let QZ=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(mid,ids,label,mode,k,week){ids=ids.filter(id=>QI[id]);if(!ids.length){toast(Tx('toast.noq','Aucune question ici'));return}
 QZ={mid,ids:shuffle(ids),idx:0,ans:{},perm:{},label,mode:mode||'suj',ok:0,k,week};S.cur=QZ;save();go('quiz',{})}
function startSujet(mid,k){if(S.timed){startTimed(mid,sujets(mid)[k],Tx('quiz.lbl.suj','Sujet {k}',{k:k+1}),k);return}startQuiz(mid,sujets(mid)[k],Tx('quiz.lbl.suj','Sujet {k}',{k:k+1}),'suj',k)}

function startDiff(mid){const ids=diffIds(mid);startQuiz(mid||(QI[ids[0]]||{}).m,ids,Tx('quiz.lbl.diff','Notions à revoir'),'diff')}
function resumeQuiz(){QZ=S.cur;if(!QZ)return;go('quiz',{})}
function curQ(){return QI[QZ.ids[QZ.idx]]||{m:QZ.mid,q:'',t:'qcm',o:[]}}
function permOf(q){if(!QZ.perm[q.id])QZ.perm[q.id]=shuffle((q.o||[]).map((x,i)=>i));return QZ.perm[q.id]}
function rec(q,ok){const s=S.qs[q.id]||{n:0,k:0};s.n++;if(ok)s.k++;s.l=ok?1:0;s.t=Date.now();S.qs[q.id]=s;
 if(!ok)S.diff[q.id]=1;else if(QZ&&QZ.mode==='diff')delete S.diff[q.id];S.xp+=ok?10:2;touchStreak();save()}
function imgSrc(n){const _f=(window.__IMGF||{})[n];if(_f&&!document.getElementById('img-'+n))return _f;if(String(n)[0]==='x'){if(IMGR[n])return IMGR[n];const e=document.getElementById('img-'+n);return e?e.textContent:''}const e=document.getElementById('img-'+n);return e?e.textContent:''}

 document.body.appendChild(o);const tx=$('#crTx',o);

function startWeek(w,kind,mid){const lab=Tx('week.lbl','Semaine {w}',{w});if(kind==='q'){const ids=weekQuizIds(w,mid,30);if(!ids.length){toast(Tx('toast.noq','Aucune question ici'));return}startQuiz(mid||'',ids,Tx('week.quiz','Quiz de la semaine {w}',{w}),'week',null,w)}else{const ids=weekCardIds(w,mid);startFlash(mid||'',ids,Tx('week.flash','Flashcards de la semaine {w}',{w}))}}
B('programme.week','Quiz & flashcards de la semaine',()=>{const P=PROGS()[progId()],cw=Math.min(P.w,Math.max(1,Math.floor(Math.max(0,todayIdx())/7)+1));const row=w=>{const {u,learn}=weekUnits(w);if(!u.length)return'';const nq=weekQuizIds(w,'',30).length,nc=weekCardIds(w).length,sc=(S.wq||{})[w];
  return `<div class="wkq ${w===cw?'cur':''}"><div class="wh"><b>${esc(Tx('week.lbl','Semaine {w}',{w}))}</b>${w===cw?' <span class="pill o">'+esc(Tx('heures.now','cette semaine'))+'</span>':''}${sc!=null?' <span class="pill">'+esc(Tx('week.best','meilleure note {s}/20',{s:sc}))+'</span>':''}<small>${esc(learn?Tx('week.learn','{n} chapitre(s) appris',{n:u.length}):Tx('week.rev','{n} chapitre(s) révisé(s)',{n:u.length}))} : ${esc(u.slice(0,4).map(x=>matOf(x.mid).short+' ch.'+(x.c+1)).join(', '))}${u.length>4?'…':''}</small></div><div class="row2"><button class="btn coral" onclick="startWeek(${w},'q')">📝 ${esc(Tx('week.q','Quiz ({n})',{n:nq}))}</button><button class="btn light" onclick="startWeek(${w},'f')">🃏 ${esc(Tx('week.f','Flashcards ({n})',{n:nc}))}</button></div></div>`};
 const past=[];for(let w=cw-1;w>=1;w--)past.push(w);
 return `<div class="card sf"><h3>${T('week.h','🗓️ Quiz & flashcards de la semaine')}</h3><div class="muted small">${T('week.help','Chaque semaine du programme a son quiz et ses flashcards, sur les chapitres prévus cette semaine-là.')}</div>${row(cw)||`<div class="empty">${T('week.none','Rien de prévu cette semaine.')}</div>`}${row(cw+1)?`<div class="muted small" style="margin-top:8px">${T('week.next','Semaine suivante')}</div>`+row(cw+1):''}${past.length?`<details class="dl"><summary>${T('week.past','Semaines précédentes ({n})',{n:past.length})}</summary>${past.map(row).join('')}</details>`:''}</div>`});
B('programme.me','Ma semaine',()=>{const {P,i,ph,w,over}=phaseNow(),st=planStats();
 const acts=[[[Tx('prog.a1a','📋 Lire les résumés de cours'),"tab('matieres')"],[Tx('prog.a1b','✍️ Faire un sujet de 50 questions'),"tab('matieres')"],[Tx('prog.a1c','📌 Voir mes notions oubliées'),"go('diff',{id:''})"]],[[Tx('prog.a2a','🎯 Travailler mes points faibles'),"startDiff('')"],[Tx('prog.a2b','✍️ Continuer les sujets'),"tab('matieres')"]],[[Tx('prog.a3a','⏱️ Sujets en mode chronométré'),"S.timed=true;save();tab('matieres')"],[Tx('prog.a3b','📈 Suivre mes résultats'),"tab('stats')"]],[[Tx('prog.a4a','📌 Vider ma liste de notions difficiles'),"startDiff('')"],[Tx('prog.a4b','🏆 Refaire les sujets en chronométré'),"S.timed=true;save();tab('matieres')"]]][i];
 return `<div class="card sf"><div class="step"><div class="n" style="background:${ph.c}">${i+1}</div><div class="tx"><small class="muted">${T('programme.me.lbl','{prog} · semaine {w} sur {tw}',{prog:esc(P.n),w:Math.min(w,P.w),tw:P.w})}</small><b>${esc(ph.n)} — ${esc(ph.o)}</b></div></div>
 ${over?`<div class="fb good" style="margin-top:12px">${T('programme.over','🎉 Programme terminé ! Continue en mode Projet ou choisis un autre programme.')}</div>`:''}
 <div class="kpis" style="margin-top:12px"><div class="kpi sf"><b>${st.thisWeek}/${st.target}</b><span>${T('programme.k1','sujets cette semaine')}</span></div><div class="kpi sf"><b>${st.uniq}/${st.tot}</b><span>${T('programme.k2','sujets faits au moins une fois')}</span></div></div>
 <div class="bar" style="margin:10px 0 4px"><i style="width:${Math.min(100,st.thisWeek/st.target*100)}%"></i></div>
 <div style="margin-top:12px">${acts.map(a=>`<button class="btn light" style="justify-content:flex-start" onclick="${a[1]}">${esc(a[0])}</button>`).join('')}</div>
 <div class="small muted">${T('programme.start','Début de ma révision :')}</div><input type="date" class="tin" id="pStart" value="${esc(S.start||today())}"></div>`},{after:r=>{const e=$('#pStart',r);if(e)e.onchange=()=>{S.start=e.value;save();render()}}});
B('programme.gen','Généralité & méthode',()=>`<div class="gen"><div class="box sf" style="--bx:#FDECEE"><h4>${T('prog.g.h','Généralité')}</h4><ul><li>${T('prog.g.1','Se fixer un objectif général')}</li><li>${T('prog.g.2','Objectif : être au top en stage')}</li><li>${T('prog.g.3','Avoir le meilleur score au National')}</li></ul></div>
 <div class="box sf" style="--bx:#EAF7EC"><h4>${T('prog.n.h','Notions du cours')}</h4><ul><li>${T('prog.n.1','Identifier les notions oubliées')}</li><li>${T('prog.n.2','Suivre le programme choisi')}</li><li>${T('prog.n.3','Faire chaque sujet au moins une fois')}</li></ul></div>
 <div class="box sf" style="--bx:#E7F1FC"><h4>${T('prog.p.h','La méthode')}</h4><ul><li>${T('prog.p.1','Se concentrer sur les points faibles et l’essentiel')}</li><li>${T('prog.p.2','Résumés complets + Q&A')}</li></ul></div></div><div style="height:14px"></div>`);
B('programme.table','Les 4 étapes du programme',()=>{const {P,i:cur}=phaseNow();return `<div class="secT">${T('programme.table','Étapes · Objectifs · Période')}<span class="ln"></span></div><div class="muted small" style="margin:-6px 0 10px">${esc(P.e+' '+P.n)}</div><div class="ptab">${P.ph.map((p,n)=>`<div class="pst sf ${n===cur?'cur':''}" style="--pc:${p.c}"><div class="h"><b style="color:${p.c}">${n+1}. ${esc(p.n)}</b><span class="per">${esc(Tx('programme.weeks','Semaines {a} à {b}',{a:p.f,b:p.t}))}</span></div><div class="ob">🎯 ${esc(p.o)}</div><ul>${p.det.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`).join('')}</div>`});

/* ======================= STATISTIQUES ======================= */
B('stats.kpis','Chiffres clés',()=>{const ans=Object.values(S.qs);const n=ans.length,ok=ans.filter(a=>a.l).length;const ex=S.exams;const best=ex.length?Math.max(...ex.map(e=>e.sc)):0;
 return `<div class="kpis"><div class="kpi sf"><b>${n}</b><span>${T('stats.k1','questions travaillées')}</span></div><div class="kpi sf"><b>${n?Math.round(ok/n*100):0}%</b><span>${T('stats.k2','de réussite')}</span></div><div class="kpi sf"><b>${ex.length}</b><span>${T('stats.k3','examens passés')}</span></div><div class="kpi sf"><b>${best}/20</b><span>${T('stats.k4','meilleure note')}</span></div><div class="kpi sf"><b>${S.xp}</b><span>${T('stats.k5','XP gagnés')}</span></div><div class="kpi sf"><b>${diffIds('').length}</b><span>${T('stats.k6','notions à revoir')}</span></div></div><div style="height:14px"></div>`});
B('stats.mat','Maîtrise par matière',()=>`<div class="card sf"><h3>${T('stats.mat','Maîtrise par matière')}</h3>${myMats().map(m=>{const st=mStat(m.id);return `<div class="sbar" onclick="openMat('${jsq(m.id)}')" style="cursor:pointer"><span class="nmx">${esc(m.emo+' '+m.short)}</span><span class="tr"><i style="width:${st.pct}%;background:${esc(m.col)}"></i></span><span class="pc">${st.pct}%</span></div>`}).join('')}</div>`);
B('stats.exams','Historique des examens',()=>S.exams.length?`<div class="card sf"><h3>${T('stats.exams','📝 Mes examens')}</h3>${S.exams.slice(-10).reverse().map(e=>`<div class="sbar"><span class="nmx">${esc(matOf(e.mid).short)} · ${esc(e.d)}</span><span class="tr"><i style="width:${e.sc*5}%;background:${e.sc>=10?'var(--green)':'var(--red)'}"></i></span><span class="pc">${e.sc}</span></div>`).join('')}</div>`:'');

/* ======================= PROFIL ======================= */
B('profile.identity','Identité & avatar',()=>`<div class="card sf"><h3>${T('profile.me','Mon profil')}</h3><input class="tin" id="pName" value="${esc(S.name)}" placeholder="${esc(Tx('welcome.ph','Ton prénom et ton nom'))}"><div class="avgrid">${AVATARS.map(a=>`<button class="${S.avatar===a?'on':''}" data-av="${a}">${a}</button>`).join('')}</div><button class="btn coral" id="pSave">${T('profile.save','Enregistrer')}</button></div>`,{after:r=>{$$('[data-av]',r).forEach(b=>b.onclick=()=>{S.avatar=b.dataset.av;save();render()});const s=$('#pSave',r);if(s)s.onclick=()=>{S.name=$('#pName',r).value.trim()||S.name;save();toast(Tx('toast.profile','Profil enregistré ✅'));render()}}});
B('profile.cursus','Filière, année & cahier des cours',()=>`<div class="card sf"><h3>${T('profile.cursus','🎓 Mon cursus')}</h3><div class="pills" style="margin-bottom:12px"><span class="pill">${esc(S.fil||'—')}</span><span class="pill o">${esc(S.niv||'—')}</span><span class="pill">${T('profile.extra','+{n} cours ajouté(s)',{n:S.extra.length})}</span></div>
 <label class="timed"><input type="checkbox" ${S.prevCh!==false?'checked':''} onchange="S.prevCh=this.checked;save();recalc();render()"> ${T('profile.prevch','Voir aussi les chapitres des années précédentes')}</label><button class="btn light" onclick="go('filiere')">${T('profile.change','✏️ Changer de filière / d’année')}</button><button class="btn light" onclick="{CAHIER=S.extra.slice();go('autres')}">${T('profile.cahier','📒 Mon cahier des cours')}</button></div>`);
B('profile.colors','Couleurs (étudiant)',()=>{const P=PALETTES();return `<div class="card sf"><h3>${T('profile.colors','🎨 Couleurs de l’application')}</h3><div class="thg">${P.map((c,i)=>`<button class="thb ${S.theme&&S.theme.pal===i?'on':''}" data-th="${i}"><span class="sw" style="background:linear-gradient(135deg,${c.w?'#ffffff':c.h1} 0 50%,${c.acc} 50% 75%,${c.acc2} 75%);border:1px solid #ddd"></span>${esc(c.n)}</button>`).join('')}</div><button class="btn light" id="pDef">${T('profile.c.default','Palette par défaut de l’appli')}</button>
 <div class="lbl3">${T('profile.icons','Style des icônes')}</div><div class="icsel">${[['emoji',Tx('ic.emoji','Emoji couleur')],['fin',Tx('ic.fin','Traits fins')],['epais',Tx('ic.epais','Traits épais')],['rond',Tx('ic.rond','Pastilles')]].map(o=>`<button class="${icoStyle()===o[0]?'on':''}" onclick="S.icons='${o[0]}';save();buildNav();render()"><span class="icp">${o[0]==='emoji'?'🏠 📁 🕒':`<svg class="ico ico-${o[0]}" viewBox="0 0 24 24"><use href="#i-home"/></svg><svg class="ico ico-${o[0]}" viewBox="0 0 24 24"><use href="#i-folder"/></svg><svg class="ico ico-${o[0]}" viewBox="0 0 24 24"><use href="#i-clock"/></svg>`}</span>${esc(o[1])}</button>`).join('')}</div></div>`},{after:r=>{$$('[data-th]',r).forEach(b=>b.onclick=()=>{S.theme={pal:+b.dataset.th};save();applyLook();render()});const d=$('#pDef',r);if(d)d.onclick=()=>{S.theme=null;save();applyLook();render()}}});
B('profile.data','Mes données',()=>`<div class="card sf"><h3>${T('profile.data','💾 Mes données')}</h3><div class="small muted" style="margin-bottom:10px">${T('profile.data.help','Ta progression est enregistrée sur cet appareil. Exporte-la pour la transférer sur un autre téléphone.')}</div>
 <button class="btn" onclick="if(!EDITMODE)exportData()">${T('profile.export','⬇️ Exporter ma progression')}</button><button class="btn light" onclick="if(!EDITMODE)$('#imp').click()">${T('profile.import','⬆️ Importer une progression')}</button>
 <button class="btn ghost" onclick="if(!EDITMODE&&confirm('${jsq(Tx('profile.reset.confirm','Effacer toute ta progression ?'))}')){localStorage.removeItem(SKEY);S=load();applyLook();tab('home')}">${T('profile.reset','🗑️ Réinitialiser')}</button></div>`);
function download(name,text,type){const b=new Blob([text],{type:type||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function exportData(){download(APPID+'-progression-'+today()+'.json',JSON.stringify(S),'application/json')}

/* ======================= DÉMARRAGE ======================= */
const SHELL=()=>`<div class="layout" id="layout"><aside class="side" id="side"></aside><div class="app" id="app"></div></div><nav class="nav" id="nav"></nav><div class="toast" id="toast"></div><input type="file" id="imp" accept=".json,application/json" class="hide">`;
function bindStatic(){$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;S=Object.assign(load(),d);save();applyLook();toast(Tx('toast.imported','Progression importée ✅'));render()}catch(x){toast(Tx('toast.badfile','Fichier invalide'))}};r.readAsText(f);e.target.value=''}}
function boot(){RO=!window.PORTAIL_EDITOR;S=load();E=normE(EMB);loadXDom();
 if(!RO){let loc=null;try{loc=JSON.parse(localStorage.getItem(EKEY)||'null')}catch(e){}if(loc&&(loc.base||0)>=(EMB.rev||0)){const ff=E.fontFiles;E=normE(loc);if((!E.fontFiles||!E.fontFiles.length)&&ff.length)E.fontFiles=ff}E.base=EMB.rev||0}
 applyContent();document.body.insertAdjacentHTML('afterbegin',SHELL());iconSprite();buildNav();bindStatic();applyLook();touchStreak();VIEW=S.onb?'home':'welcome';render();
 if(!RO)window.PORTAIL_EDITOR.init();window.PORTAIL_READY=true;loadXIdb()}
async function loadXIdb(){const miss=((E.content||{}).newMat||[]).filter(m=>!XD[m.id]);if(!miss.length)return;let n=0;for(const m of miss){try{const x=await idbGet(m.src+':x');if(x){const im=await idbGet(m.src+':img');if(im)Object.assign(IMGR,im);regX(m.id,x);n++}}catch(e){}}if(n){Object.keys(CARDC).forEach(k=>delete CARDC[k]);PLANC=null;applyContent();render()}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');</script>
